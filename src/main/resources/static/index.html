<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CourtFlow Frontend</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(34, 211, 238, 0.18), transparent 25%),
          linear-gradient(180deg, #f7fbff 0%, #eaf2f9 100%);
        color: #0f172a;
      }

      main {
        width: min(720px, calc(100vw - 32px));
        padding: 32px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(219, 230, 241, 0.9);
        box-shadow: 0 28px 70px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(18px) saturate(180%);
      }

      h1 {
        margin: 0;
        font-size: 32px;
      }

      p {
        margin: 12px 0 0;
        color: #64748b;
        line-height: 1.7;
      }

      .links {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 24px;
      }

      a {
        display: block;
        padding: 16px 18px;
        border-radius: 18px;
        color: #0f172a;
        text-decoration: none;
        background: #ffffff;
        border: 1px solid #dbe6f1;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      a:hover {
        transform: translateY(-1px);
        border-color: #0891b2;
        box-shadow: 0 12px 24px rgba(8, 145, 178, 0.12);
      }

      strong {
        display: block;
        font-size: 18px;
      }

      span {
        display: block;
        margin-top: 6px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CourtFlow Vue Frontend</h1>
      <p>当前前端正在从原生静态页面迁移到 Vue。开发阶段可直接从下面两个入口进入用户端与管理端。</p>
      <div class="links">
        <a href="/demo/index.html">
          <strong>用户端</strong>
          <span>移动壳布局、预约流程、个人中心</span>
        </a>
        <a href="/admin/index.html">
          <strong>管理端</strong>
          <span>运营总览、场馆资源、预约订单与支付管理</span>
        </a>
      </div>
    </main>
  </body>
</html>
